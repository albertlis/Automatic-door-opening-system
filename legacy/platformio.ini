; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pro16MHzatmega328]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
lib_ignore = TinyWireM
monitor_speed = 9600
build_flags = -Wall -Wextra -std=c++17 -Os -flto -ffunction-sections -fdata-sections -Wl,--gc-sections
lib_deps = 
	mikalhart/Streaming@^1.0.0
	adafruit/RTClib@^2.1.4
	enjoyneering/BH1750FVI@^1.2.1
	arduino-libraries/Servo@^1.2.2

[env:pro16MHzatmega328-test]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
build_flags = -DUNIT_TEST -std=c++17 -Wall -Wextra
lib_deps = 
	mikalhart/Streaming@^1.0.0
